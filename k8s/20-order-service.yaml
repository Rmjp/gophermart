apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: gophermart-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: localhost/order-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: gophermart-dev
spec:
  # ClusterIP is default. 
  # It means "Only accessible inside the cluster", which is secure.
  type: ClusterIP 
  selector:
    app: order-service
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051