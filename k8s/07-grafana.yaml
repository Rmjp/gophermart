apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: gophermart-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:10.0.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin" # Default login
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: gophermart-dev
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30003 # Access UI at localhost:30003