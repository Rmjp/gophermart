# 1. Configuration (Scrape Config)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: gophermart-dev
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'gophermart'
        static_configs:
          - targets: ['api-gateway:8080']
---
# 2. Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: gophermart-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v2.45.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
# 3. Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: gophermart-dev
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30002 # Access UI at localhost:30002